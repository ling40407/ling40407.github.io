
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的作業記錄網站</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      background: #f4f4f4;
      color: #333;
      transition: 0.3s;
    }

    .dark {
      background: #222;
      color: white;
    }

    section {
      padding: 20px;
      margin: 15px 0;
      border-radius: 10px;
      background: rgba(128, 128, 128, 0.12);
    }

    button {
      padding: 10px 16px;
      margin: 5px;
      cursor: pointer;
      border-radius: 8px;
    }
  </style>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
  <h1>我的個人網頁</h1>
  <p>歡迎來到我的 GitHub Pages！</p>

  <button id="themeBtn">切換深色模式</button>

  <section>
    <h2>關於我</h2>
    <p>本網頁為 Web 基本原理與技術的 Lab2 作業。</p>
  </section>

  <section>
    <h2>我的作品</h2>
    <button id="showBtn">顯示作品介紹</button>
    <p id="project" style="display:none;">
      這裡可以放入你的程式作品、課程專題與作品連結。
    </p>
  </section>

  <script>
    $(document).ready(function() {

      // 切換深色模式
      $("#themeBtn").click(function() {
        $("body").toggleClass("dark");
      });

      // 展開或收合作品介紹
      $("#showBtn").click(function() {
        $("#project").slideToggle();
      });

    });
  </script>
</body>
</html>
